---
- name: Inject Environment-Specific ConfigMaps
  kubernetes.core.k8s:
    state: present
    src: "../kubernetes/environments/{{ k8s_config_dir }}/configmap.yaml"

- name: Deploy Immutable Application Core Blueprints
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace }}"
    src: "../kubernetes/base/deployment.yaml"
